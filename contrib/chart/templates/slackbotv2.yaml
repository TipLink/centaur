{{- if .Values.slackbotv2.enabled }}
{{- $apiRsName := include "centaur.componentName" (dict "root" . "component" "api-rs") -}}
{{- $console := include "centaur.consoleValues" . | fromYaml -}}
{{- $repoCacheStorageType := include "centaur.repoCacheStorageType" . -}}
{{- $repoCacheUsePvc := eq $repoCacheStorageType "persistentVolumeClaim" -}}
{{- $repoCachePvcName := include "centaur.repoCachePvcName" . -}}
{{- $overlaySources := include "centaur.overlaySources" . | fromJsonArray -}}
{{- $effectiveRepoRefs := dict -}}
{{- range $repo, $ref := .Values.repoCache.repositoryRefs -}}
{{- $_ := set $effectiveRepoRefs $repo $ref -}}
{{- end -}}
{{- range .Values.repoCache.repositories -}}
{{- if not (kindIs "string" .) -}}
{{- $repo := get . "repo" | default "" -}}
{{- $ref := get . "ref" | default "" -}}
{{- if and $repo $ref (not (hasKey $effectiveRepoRefs $repo)) -}}
{{- $_ := set $effectiveRepoRefs $repo $ref -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- range $source := $overlaySources -}}
{{- $repo := get $source "repo" | default "" -}}
{{- $ref := get $source "ref" | default "" -}}
{{- if and $repo $ref (not (hasKey $effectiveRepoRefs $repo)) -}}
{{- $_ := set $effectiveRepoRefs $repo $ref -}}
{{- end -}}
{{- end -}}
{{- $extensionModules := list -}}
{{- $extensionSources := list -}}
{{- range $source := $overlaySources -}}
{{- $repo := get $source "repo" | default "" -}}
{{- with (get $source "slackbotSubdir") -}}
{{- $ref := get $source "ref" | default "" -}}
{{- if not (regexMatch "^[0-9a-fA-F]{40}$" $ref) -}}
{{- fail (printf "overlays source %s: slackbotSubdir requires ref to be a full 40-character commit SHA" $repo) -}}
{{- end -}}
{{- $effectiveRef := get $effectiveRepoRefs $repo | default "" -}}
{{- if ne (lower $effectiveRef) (lower $ref) -}}
{{- fail (printf "overlays source %s: slackbotSubdir ref %s conflicts with effective repo-cache ref %s" $repo $ref ($effectiveRef | default "<default branch>")) -}}
{{- end -}}
{{- $repositoryPath := printf "%s/%s" $.Values.repoCache.hostPath $repo -}}
{{- $modulePath := printf "%s/%s/index.mjs" $repositoryPath . -}}
{{- $extensionModule := dict "modulePath" $modulePath "repositoryPath" $repositoryPath "revision" (lower $ref) -}}
{{- $extensionModules = append $extensionModules $extensionModule -}}
{{- $extensionSource := dict "repo" $repo "ref" (lower $ref) "slackbotSubdir" . -}}
{{- $extensionSources = append $extensionSources $extensionSource -}}
{{- end -}}
{{- end -}}
{{- if and (gt (len $extensionModules) 0) (not .Values.repoCache.enabled) -}}
{{- fail "overlays.sources[].slackbotSubdir requires repoCache.enabled=true" -}}
{{- end -}}
{{- $useExtensionRepoCache := gt (len $extensionModules) 0 -}}
{{- $slackbotV2MetricsAnnotations := dict -}}
{{- if .Values.slackbotv2.metrics.scrapeAnnotations -}}
{{- $slackbotV2MetricsAnnotations = dict "prometheus.io/scrape" "true" "prometheus.io/path" .Values.slackbotv2.metrics.path "prometheus.io/port" "3001" -}}
{{- $slackbotV2MetricsAnnotations = mergeOverwrite $slackbotV2MetricsAnnotations (.Values.slackbotv2.metrics.annotations | default dict) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "centaur.componentName" (dict "root" . "component" "slackbotv2") }}
  labels:
{{ include "centaur.componentLabels" (dict "root" . "component" "slackbotv2") | nindent 4 }}
spec:
  replicas: {{ .Values.slackbotv2.replicaCount }}
  selector:
    matchLabels:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" "slackbotv2") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/infra-secrets: {{ include "centaur.infraSecretsChecksum" . }}
{{- if $extensionSources }}
        checksum/slackbot-extensions: {{ toJson $extensionSources | sha256sum }}
{{- end }}
{{- with $slackbotV2MetricsAnnotations }}
{{ toYaml . | nindent 8 }}
{{- end }}
      labels:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" "slackbotv2") | nindent 8 }}
        centaur.ai/metrics: slackbotv2
    spec:
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: slackbotv2
          image: {{ printf "%s:%s" .Values.slackbotv2.image.repository .Values.slackbotv2.image.tag | quote }}
          imagePullPolicy: {{ .Values.slackbotv2.image.pullPolicy }}
          env:
            - name: PORT
              value: "3001"
            - name: CENTAUR_API_URL
              value: {{ printf "http://%s:%v" $apiRsName .Values.apiRs.port | quote }}
            - name: SLACKBOTV2_MODE
              value: {{ .Values.slackbotv2.mode | quote }}
            # New threads without an explicit --claude/--amp/--codex/
            # --nanocodex flag run the deployment's default harness.
            - name: SLACKBOTV2_DEFAULT_HARNESS
              value: {{ .Values.sandbox.harnessEngine | quote }}
            - name: SLACKBOTV2_CODEX_NANOCODEX_ROLLOUT_PERCENT
              value: {{ .Values.slackbotv2.codexNanocodexRolloutPercent | quote }}
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "centaur.secretEnvName" . }}
                  key: {{ printf "%sSLACK_BOT_TOKEN" .Values.secretManager.envPrefix }}
{{- if eq .Values.slackbotv2.mode "webhook" }}
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "centaur.secretEnvName" . }}
                  key: {{ printf "%sSLACK_SIGNING_SECRET" .Values.secretManager.envPrefix }}
{{- end }}
{{- if eq .Values.slackbotv2.mode "socket" }}
            - name: SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "centaur.secretEnvName" . }}
                  key: {{ printf "%sSLACK_APP_TOKEN" .Values.secretManager.envPrefix }}
{{- end }}
            - name: SLACKBOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "centaur.secretEnvName" . }}
                  key: {{ printf "%sSLACKBOT_API_KEY" .Values.secretManager.envPrefix }}
            - name: SLACKBOTV2_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "centaur.secretEnvName" . }}
                  key: {{ printf "%sDATABASE_URL" .Values.secretManager.envPrefix }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "centaur.secretEnvName" . }}
                  key: {{ printf "%sOPENAI_API_KEY" .Values.secretManager.envPrefix }}
                  optional: true
            - name: SLACKBOTV2_USER_NAME
              value: {{ .Values.slackbotv2.userName | quote }}
            - name: SLACKBOTV2_ACTIVITY_SUMMARY_STATUS_ENABLED
              value: {{ .Values.apiRs.activitySummary.enabled | quote }}
            - name: SLACKBOTV2_AUTO_JOIN_CREATED_CHANNELS
              value: {{ .Values.slackbotv2.autoJoinCreatedChannels | quote }}
            - name: SLACKBOTV2_AGENT_VIEW_ENABLED
              value: {{ .Values.slackbotv2.agentViewEnabled | quote }}
            - name: SLACKBOTV2_STEERING_REACTION_ENABLED
              value: {{ .Values.slackbotv2.steeringReactionEnabled | quote }}
            - name: SLACKBOTV2_STEERING_REACTION
              value: {{ .Values.slackbotv2.steeringReaction | quote }}
            - name: SLACKBOTV2_RESPONSE_METADATA_MODE
              value: {{ .Values.slackbotv2.responseMetadataMode | quote }}
            - name: SLACKBOTV2_RESPONSE_SERVICE_TIER_ENABLED
              value: {{ .Values.slackbotv2.responseServiceTierEnabled | quote }}
            - name: SLACKBOTV2_MESSAGE_OVERRIDES_STRATEGY
              value: {{ .Values.slackbotv2.messageOverridesStrategy.mode | quote }}
            - name: SLACKBOTV2_MESSAGE_OVERRIDES_MODEL
              value: {{ .Values.slackbotv2.messageOverridesStrategy.model | quote }}
            - name: SLACKBOTV2_MESSAGE_OVERRIDES_OPENAI_BASE_URL
              value: {{ .Values.slackbotv2.messageOverridesStrategy.openaiBaseUrl | quote }}
            - name: SLACKBOTV2_MESSAGE_OVERRIDES_TIMEOUT_MS
              value: {{ .Values.slackbotv2.messageOverridesStrategy.timeoutMs | quote }}
            - name: SLACKBOTV2_MESSAGE_OVERRIDES_MAX_OUTPUT_TOKENS
              value: {{ .Values.slackbotv2.messageOverridesStrategy.maxOutputTokens | quote }}
{{- if $extensionModules }}
            - name: SLACKBOTV2_EXTENSION_MODULES
              value: {{ toJson $extensionModules | quote }}
{{- end }}
{{- if and $console.chat.enabled $console.publicUrl }}
            # Public origin of the Console UI (matches the Console's own
            # CENTAUR_CONSOLE_PUBLIC_URL). When chat is enabled, the first
            # assistant message in a Slack thread gets an "Open chat in Console"
            # link.
            - name: CENTAUR_CONSOLE_PUBLIC_URL
              value: {{ $console.publicUrl | quote }}
{{- end }}
{{- if .Values.slackbotv2.assistantStatus }}
            - name: SLACKBOTV2_ASSISTANT_STATUS
              value: {{ .Values.slackbotv2.assistantStatus | quote }}
{{- end }}
{{- if .Values.slackbotv2.externalOrgAllowlist }}
            - name: SLACKBOT_EXTERNAL_ORG_ALLOWLIST
              value: {{ .Values.slackbotv2.externalOrgAllowlist | quote }}
{{- end }}
{{- if .Values.slackbotv2.triggerBotAllowlist }}
            - name: SLACKBOT_TRIGGER_BOT_ALLOWLIST
              value: {{ .Values.slackbotv2.triggerBotAllowlist | quote }}
{{- end }}
{{- if .Values.slackbotv2.channelDefaults }}
            # Per-channel default harness / model / provider / reasoning, keyed
            # by Slack conversation id (each value an object of harness/model/
            # provider/reasoning fields, e.g. { harness: claude, model: opus }).
            # Applied below an explicit/sticky per-thread flag and above the
            # deployment/baked default, and forwarded onto the harness input line
            # so it takes effect.
            - name: SLACKBOTV2_CHANNEL_DEFAULTS
              value: {{ .Values.slackbotv2.channelDefaults | toJson | quote }}
{{- end }}
{{- if .Values.codex.customProviders }}
            - name: CODEX_CUSTOM_PROVIDERS
              value: {{ .Values.codex.customProviders | toJson | quote }}
{{- end }}
{{- range $name := tuple "CLAUDE_MODEL" "CODEX_MODEL" "CODEX_MODEL_REASONING_EFFORT" }}
{{- if and (hasKey $.Values.sandbox.extraEnv $name) (not (hasKey $.Values.slackbotv2.extraEnv $name)) }}
            # Mirror the deployer's harness default override (sandbox.extraEnv)
            # so the Slack Console-link line names the model/reasoning policy
            # sandboxes actually run. slackbotv2.extraEnv wins if it sets the
            # same variable.
            - name: {{ $name }}
              value: {{ index $.Values.sandbox.extraEnv $name | toString | quote }}
{{- end }}
{{- end }}
{{- range $name, $value := .Values.slackbotv2.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
{{- end }}
          envFrom:
            - secretRef:
                name: {{ include "centaur.secretEnvName" . }}
          ports:
            - containerPort: 3001
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: 3001
            timeoutSeconds: 5
          securityContext:
{{ toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
{{ toYaml .Values.slackbotv2.resources | nindent 12 }}
{{- if $useExtensionRepoCache }}
          volumeMounts:
            - name: repo-cache
              mountPath: {{ .Values.repoCache.hostPath | quote }}
              readOnly: true
{{- end }}
{{- if $useExtensionRepoCache }}
      volumes:
        - name: repo-cache
{{- if $repoCacheUsePvc }}
          persistentVolumeClaim:
            claimName: {{ $repoCachePvcName | quote }}
            readOnly: true
{{- else }}
          hostPath:
            path: {{ .Values.repoCache.hostPath | quote }}
            type: DirectoryOrCreate
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "centaur.componentName" (dict "root" . "component" "slackbotv2") }}
  labels:
{{ include "centaur.componentLabels" (dict "root" . "component" "slackbotv2") | nindent 4 }}
spec:
  selector:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" "slackbotv2") | nindent 4 }}
  ports:
    - name: http
      port: 3001
      targetPort: 3001
{{- end }}

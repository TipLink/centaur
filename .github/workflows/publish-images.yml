name: Public image publication retired

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse public image and cache publication
        run: |
          set -euo pipefail
          IFS=$'\n\t'
          echo "Public image publication is retired. Use the private deployment publisher." >&2
          exit 1

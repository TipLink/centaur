name: Validate upstream patch source
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate-patches:
    name: Validate upstream patch source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/prepare-patched-core

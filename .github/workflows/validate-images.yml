name: Publish Images

on:
  pull_request:

concurrency:
  group: validate-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: tiplink/centaur
  RUST_BUILD_PROFILE: debug

jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Test selective publication against a local OCI registry
        if: github.event.pull_request.base.ref == 'release/aws-core'
        run: |
          set -euo pipefail
          docker run -d --name test-registry -p 127.0.0.1:5000:5000 registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          printf '[registry."localhost:5000"]\n  http = true\n' > "$RUNNER_TEMP/registry.toml"
          docker buildx create --use --buildkitd-config "$RUNNER_TEMP/registry.toml" --driver docker-container --driver-opt network=host,image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
          python3 .github/scripts/test-selective-publication.py

      - name: Test PR image selection
        run: python3 .github/scripts/test-pr-images.py

      - name: Reject unsigned, unchecked, or unrelated release candidates
        run: python3 .github/scripts/test-reviewed-image-release.py

  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_build: ${{ steps.select.outputs.has_build }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      # Prove the effective build tree even when every image check is reused.
      - uses: ./.github/actions/prepare-patched-core
      - name: Select affected image checks
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/plan-pr-images.py --carry "$RUNNER_TEMP/inherited" > "$RUNNER_TEMP/plan.json"
          jq -r '"matrix=" + (.matrix|tojson), "has_build=" + (.has_build|tostring)' "$RUNNER_TEMP/plan.json" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-inputs-inherited
          path: ${{ runner.temp }}/inherited/
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  build:
    needs: plan
    if: needs.plan.outputs.has_build == 'true'
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare official upstream with reviewed patches
        id: core
        uses: ./.github/actions/prepare-patched-core

      - name: Reclaim runner disk for the agent image
        if: matrix.service == 'agent' && matrix.platform == 'linux/amd64'
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Derive platform slug
        run: |
          set -euo pipefail
          platform="${{ matrix.platform }}"
          echo "PLATFORM_SLUG=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.image }} without registry credentials
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: _core
          file: _core/${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: false
          load: ${{ matrix.service == 'agent' }}
          tags: ${{ matrix.service == 'agent' && format('{0}:validate-{1}', matrix.image, env.PLATFORM_SLUG) || '' }}
          build-args: |
            RUST_BUILD_PROFILE=${{ env.RUST_BUILD_PROFILE }}
          # Reuse the public cache written by reviewed releases. PRs import it
          # anonymously and only export to their existing GitHub Actions cache.
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:buildcache-${{ env.PLATFORM_SLUG }}
            type=gha,scope=validate-${{ matrix.image }}-${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,mode=max,scope=validate-${{ matrix.image }}-${{ env.PLATFORM_SLUG }}

      - name: Probe packaged agent harness
        if: matrix.service == 'agent'
        env:
          AGENT_IMAGE: ${{ matrix.image }}:validate-${{ env.PLATFORM_SLUG }}
        run: bash scripts/probe-agent-harness-image.sh "$AGENT_IMAGE"

      - name: Record validated BuildKit inputs
        env:
          BUILD_REF: ${{ fromJSON(steps.build.outputs.metadata)['buildx.build.ref'] }}
          SERVICE: ${{ matrix.service }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/proof"
          python3 .github/scripts/plan-pr-images.py --record "$RUNNER_TEMP/proof" "$SERVICE" "$PLATFORM" "$BUILD_REF"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-inputs-${{ matrix.service }}-${{ env.PLATFORM_SLUG }}
          path: ${{ runner.temp }}/proof/
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  image-validation-success:
    name: Image validation success
    runs-on: ubuntu-latest
    if: always()
    needs: [plan, build, release-policy]
    steps:
      - name: Require every image validation build to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          HAS_BUILD: ${{ needs.plan.outputs.has_build }}
          BUILD_RESULT: ${{ needs.build.result }}
          POLICY_RESULT: ${{ needs.release-policy.result }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RESULT" == success && "$POLICY_RESULT" == success ]]
          [[ "$HAS_BUILD/$BUILD_RESULT" == true/success || "$HAS_BUILD/$BUILD_RESULT" == false/skipped ]]
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: pr-inputs-*
          path: ${{ runner.temp }}/validated
          merge-multiple: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-image-validation-v1
          path: ${{ runner.temp }}/validated/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

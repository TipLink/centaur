[project]
name = "centaur-approvals"
description = "Request and await Slack approval for configured privileged tool actions"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27.0", "typer>=0.12.0"]

[project.scripts]
centaur-approvals = "centaur_tool_centaur_approvals.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["."]
[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_centaur_approvals"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.centaur]
module = "client.py"
hosts = []
secrets = []
